services:
  api:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      AUDIT_DB_PATH: /app/data/audit.db
      UPLOAD_DIR: /app/uploads
      HF_HOME: /home/app/.cache/huggingface
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - app_data:/app/data
      - app_uploads:/app/uploads
      - model_cache:/home/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app_data:
  app_uploads:
  model_cache:
  redis_data:
